apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: aife
  rules:
    # The whole aife bucket is world-readable for anonymous principals.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["anonymous"]
      condition:
        match:
          expr: request.resource.attr.bucket == "aife"

    # Authenticated users can read only within their assigned path prefix.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: request.resource.attr.bucket == "aife" &&
            request.principal.attr.path_prefix != "" &&
            request.resource.attr.key.startsWith(request.principal.attr.path_prefix)

    # Admin can read any object in the aife bucket.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["admin"]
      condition:
        match:
          expr: request.resource.attr.bucket == "aife"
