apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: minio_object
  rules:
    # Anonymous can read only objects under public/ in any bucket.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["anonymous"]
      condition:
        match:
          expr: request.resource.attr.key.startsWith("public/")

    # Authenticated users can read only within their assigned path prefix.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: >-
            request.principal.attr.path_prefix != "" &&
            request.resource.attr.key.startsWith(request.principal.attr.path_prefix)

    # Admin can read any object.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["admin"]
